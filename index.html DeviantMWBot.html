<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deviant MultiWallet Bot</title><style>body{font-family:Arial;background:#0b1020;color:#fff;max-width:900px;margin:auto;padding:30px}button,input{padding:12px;margin:5px;border-radius:8px}button{cursor:pointer}.card{background:#111827;padding:20px;border-radius:14px;margin:15px 0}.muted{color:#94a3b8}</style></head><body><h1>Deviant MultiWallet Bot</h1><p class="muted">Solana Devnet testing dashboard</p><div class="card"><h2>Wallet Connection</h2><p id="state">No wallet connected.</p><button id="connect">Connect Phantom</button><button id="disconnect">Disconnect</button><p>Address: <b id="address">—</b></p><p>Devnet SOL: <b id="balance">—</b></p></div><div class="card"><h2>Buy Setup</h2><input id="mint" placeholder="Devnet token mint" style="width:90%"><br><input id="budget" type="number" value="1" step="0.001"><button onclick="plan()">Prepare Buy</button><div id="result"></div></div><script>let pub=null;function provider(){return window.phantom?.solana||window.solana}function short(a){return a.slice(0,6)+'...'+a.slice(-6)}async function connect(){let p=provider();if(!p){state.textContent='Phantom not detected. Install the Phantom browser extension and reload.';return}try{let r=await p.connect();pub=r.publicKey.toString();state.textContent='✓ Phantom connected';address.textContent=short(pub);await balance()}catch(e){state.textContent='Connection cancelled or failed.'}}async function balance(){try{let r=await fetch('https://api.devnet.solana.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'getBalance',params:[pub]})});let j=await r.json();balance.textContent=(j.result.value/1e9).toFixed(4)+' SOL'}catch(e){balance.textContent='Unable to fetch'}}async function disconnect(){try{await provider()?.disconnect()}catch(e){}pub=null;state.textContent='No wallet connected.';address.textContent='—';balance.textContent='—'}function plan(){if(!pub){alert('Connect Phantom first.');return}result.innerHTML='<p>Plan prepared for '+short(pub)+' using '+budget.value+' SOL.</p><p class="muted">Simulation only — no swap is executed yet.</p>'}connect.onclick=connect;disconnect.onclick=disconnect;</script></body></html>
